name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.2.2+cpu" "torchvision==0.17.2+cpu" "torchaudio==2.2.2+cpu"
          pip install -r requirements.txt

      - name: Show repo files (debug)
        run: ls -la

      - name: Python compile check
        run: |
          files="rag_engine.py ui_adapter.py ui_shell.py ui_theme.py smoke_ui_contract.py"
          if [ -f ./app_custom.py ]; then
            files="app_custom.py $files"
          else
            echo "WARNING: app_custom.py not found; will fail if it's required." >&2
          fi
          python -m py_compile $files

      - name: Run validation and smoke suites
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pytest tests/validation tests/smoke --junitxml=reports/pytest-junit.xml --maxfail=1 --durations=25 | tee reports/pytest-summary.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: reports/
