name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio || echo "CPU torch install skipped"
          pip install -r requirements.txt

      - name: Lint (best-effort)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          elif command -v flake8 >/dev/null 2>&1; then
            flake8 .
          else
            echo "No linter configured; skipping."
          fi

      - name: Byte-compile key modules
        run: |
          python -m py_compile app.py rag_engine.py ui_shell.py ui_adapter.py ui_theme.py smoke_ui_contract.py

      - name: Run validation and smoke tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          mkdir -p reports
          pytest tests/validation tests/smoke --maxfail=1 --durations=25 --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml
